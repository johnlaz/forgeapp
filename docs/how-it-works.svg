<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="320" viewBox="0 0 1164 320" role="img" aria-labelledby="t d">
<title id="t">AI Scan Import: four steps</title><desc id="d">Copy the prompt, paste it into Gemini or ChatGPT with your notes, bring the answer back, and Groq turns it into a full project.</desc>
<rect width="1164" height="320" rx="18" fill="#0b0d10"/><rect x=".5" y=".5" width="1163" height="319" rx="17.5" fill="none" stroke="#262c37"/>
<text x="36" y="58" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#e4e8ee" letter-spacing=".5">AI Scan Import</text>
<text x="36" y="88" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#98a2b3">Turn messy notes into a complete project in four steps.</text>
<rect x="36" y="118" width="252" height="150" rx="14" fill="#12151a" stroke="#262c37"/><circle cx="70" cy="154" r="16" fill="#7fff3a"/><text x="70" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0b0d10">1</text><text x="98" y="161" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4e8ee">Copy the prompt</text><text x="58" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">In New Project, tap Copy</text><text x="58" y="226" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">Prompt.</text><path d="M292 193 h20" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"/><path d="M306 187 l8 6 l-8 6" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="118" width="252" height="150" rx="14" fill="#12151a" stroke="#262c37"/><circle cx="350" cy="154" r="16" fill="#b06aff"/><text x="350" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0b0d10">2</text><text x="378" y="161" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4e8ee">Ask your AI</text><text x="338" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">Paste it into Gemini or</text><text x="338" y="226" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">ChatGPT with your notes.</text><path d="M572 193 h20" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"/><path d="M586 187 l8 6 l-8 6" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="596" y="118" width="252" height="150" rx="14" fill="#12151a" stroke="#262c37"/><circle cx="630" cy="154" r="16" fill="#b06aff"/><text x="630" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0b0d10">3</text><text x="658" y="161" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4e8ee">Paste the answer</text><text x="618" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">Paste or upload the</text><text x="618" y="226" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">response in LazForge.</text><path d="M852 193 h20" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"/><path d="M866 187 l8 6 l-8 6" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="876" y="118" width="252" height="150" rx="14" fill="#12151a" stroke="#262c37"/><circle cx="910" cy="154" r="16" fill="#7fff3a"/><text x="910" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0b0d10">4</text><text x="938" y="161" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e4e8ee">Groq builds it</text><text x="898" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">Log entries, parts, tags</text><text x="898" y="226" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#98a2b3">and stage are filled in.</text>
<text x="36" y="298" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Only step 4 calls Groq. Steps 2 and 3 happen in your own AI chat.</text>
</svg>