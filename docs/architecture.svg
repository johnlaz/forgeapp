<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d">
<title id="t">LazForge architecture and data flow</title>
<desc id="d">LazForge runs in the browser on your device and stores projects in localStorage and photos in IndexedDB. GitHub Pages serves the files. Groq is called only when you use an AI feature.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#98a2b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="580" rx="18" fill="#0b0d10"/><rect x=".5" y=".5" width="1199" height="579" rx="17.5" fill="none" stroke="#262c37"/>
<text x="36" y="56" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#e4e8ee" letter-spacing=".5">Where things live</text>
<text x="36" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#98a2b3">No LazForge server and no account. Your data stays on your device.</text>

<rect x="36" y="116" width="690" height="426" rx="16" fill="none" stroke="#7fff3a" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="56" y="146" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#7fff3a">YOUR DEVICE (browser or installed app)</text>
<rect x="62" y="166" width="300" height="110" rx="12" fill="#12151a" stroke="#7fff3a" stroke-width="1.5"/>
<text x="80" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">LazForge app</text>
<text x="80" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">app/index.html, one file</text>
<text x="80" y="243" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Projects, Forge Log, parts list,</text>
<text x="80" y="264" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">documents, notes, print reports</text>
<rect x="62" y="300" width="300" height="100" rx="12" fill="#12151a" stroke="#262c37" stroke-width="1.5"/>
<text x="80" y="330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">Service worker</text>
<text x="80" y="356" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Caches the app for offline use.</text>
<text x="80" y="377" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Open the app online to get updates.</text>
<rect x="398" y="166" width="304" height="110" rx="12" fill="#12151a" stroke="#b06aff" stroke-width="1.5"/>
<text x="416" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">localStorage</text>
<text x="416" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Projects, logs, parts, tags,</text>
<text x="416" y="243" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">settings and your Groq key.</text>
<rect x="398" y="300" width="304" height="100" rx="12" fill="#12151a" stroke="#b06aff" stroke-width="1.5"/>
<text x="416" y="330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">IndexedDB</text>
<text x="416" y="356" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Project photos, kept out of</text>
<text x="416" y="377" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">localStorage to save space.</text>
<text x="62" y="438" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Backups (Settings, Export JSON) contain projects only.</text>
<text x="62" y="460" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Your API key is never written into a backup file.</text>
<path d="M362 221 H394" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M212 276 V296" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#ar)"/>

<rect x="800" y="126" width="364" height="128" rx="12" fill="#12151a" stroke="#262c37" stroke-width="1.5"/>
<text x="818" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">GitHub Pages</text>
<text x="818" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Hosts the landing page and the app.</text>
<text x="818" y="203" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Delivers files to your browser once;</text>
<text x="818" y="224" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">after that the app runs offline.</text>
<rect x="800" y="292" width="364" height="150" rx="12" fill="#12151a" stroke="#b06aff" stroke-width="1.5"/>
<text x="818" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">Groq API (optional)</text>
<text x="818" y="348" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Called only when you use an AI feature:</text>
<text x="818" y="369" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Brainstorm, Summary, AI Plan, Scan Import.</text>
<text x="818" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Sends the text for that request plus your</text>
<text x="818" y="411" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">key, directly from your browser to Groq.</text>
<rect x="800" y="466" width="364" height="76" rx="12" fill="#12151a" stroke="#262c37" stroke-width="1.5"/>
<text x="818" y="496" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e8ee">Google Fonts</text>
<text x="818" y="522" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98a2b3">Loaded once, then cached by the service worker.</text>
<path d="M800 190 H730" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="742" y="180" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#98a2b3">files</text>
<path d="M726 360 H796" fill="none" stroke="#b06aff" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ar)"/>
<text x="742" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#b06aff">AI request</text>
</svg>